name: code-tests

on:
  push:
    branches:
      - main
      - 'paper/main.pdf'
      - 'paper/supplement.pdf'
      - 'paper/highlights.docx'
      - 'paper/PMC_submission_source.zip'
      - 'paper/PMC_submission_manifest.json'
      - 'research/manuscript_status.json'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'paper/**'
      - '.github/workflows/code-tests.yml'
      - '.github/workflows/pmc-final-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
