name: rbsp-validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rbsp-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run finite-model robust stress
        run: |
          rm -rf results/robust_informed
          python -m src.experiment --config configs/robust_informed.json
          python -m src.analyze_robust --run results/robust_informed

      - name: Commit refreshed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/robust_informed
          if git diff --cached --quiet; then
            echo "No evidence changes"
            exit 0
          fi
          git commit -m "Refresh R-BSP robust stress evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
