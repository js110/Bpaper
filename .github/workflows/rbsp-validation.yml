name: rbsp-validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full unit tests
        run: python -m unittest discover -s tests -v
      - name: Run frozen robust stress test
        run: |
          rm -rf results/robust_informed
          python -m src.experiment --config configs/robust_informed.json
          python -m src.analyze_robust --run results/robust_informed
      - name: Print robust summary
        run: |
          cat results/robust_informed/analysis/summary.csv
          cat results/robust_informed/analysis/paired.json
      - name: Commit reproducible stress-test evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/robust_informed
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record R-BSP exploratory stress results [skip ci]"
            git pull --rebase origin submission/pmc-2026-09-26
            git push origin HEAD:submission/pmc-2026-09-26
          fi
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended cm-super poppler-utils
      - name: Compile manuscript
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          grep -E "Overfull|Undefined control sequence|undefined references" main.log && exit 1 || true
          pdfinfo main.pdf | grep Pages
      - name: Commit compiled manuscript
        run: |
          git add paper/main.pdf paper/main.bbl
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Compile PMC manuscript with R-BSP results [skip ci]"
            git pull --rebase origin submission/pmc-2026-09-26
            git push origin HEAD:submission/pmc-2026-09-26
          fi
