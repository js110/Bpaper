name: paper-build

on:
  push:
    branches:
      - submission/pmc-2026-09-26
    paths:
      - 'paper/**'
      - '!paper/main.pdf'
      - '!paper/main.bbl'
      - '.github/workflows/paper-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended cm-super poppler-utils
      - name: Compile manuscript
        run: |
          cd paper
          latexmk -C
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          grep -E "Overfull|Undefined control sequence|undefined references" main.log && exit 1 || true
          pdfinfo main.pdf | grep Pages
      - name: Commit compiled manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf paper/main.bbl
          if git diff --cached --quiet; then
            echo "No generated manuscript changes"
          else
            git commit -m "Compile PMC manuscript [skip ci]"
            git pull --rebase origin submission/pmc-2026-09-26
            git push origin HEAD:submission/pmc-2026-09-26
          fi
