name: rbsp-boundary

on:
  workflow_dispatch:
  push:
    branches:
      - submission/pmc-2026-09-26
    paths:
      - 'research/.run-rbsp-boundary'

permissions:
  contents: write

concurrency:
  group: rbsp-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run boundary stress
        run: |
          rm -rf results/robust_boundary
          python -m src.experiment --config configs/robust_boundary.json
          python -m src.analyze_robust --run results/robust_boundary
      - name: Print boundary summary
        run: cat results/robust_boundary/analysis/paired.json
      - name: Commit boundary evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/robust_boundary
          if git diff --cached --quiet; then
            echo "No boundary result changes"
          else
            git commit -m "Record R-BSP boundary stress results [skip ci]"
            git pull --rebase origin submission/pmc-2026-09-26
            git push origin HEAD:submission/pmc-2026-09-26
          fi
