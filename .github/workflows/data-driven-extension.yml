name: data-driven-extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/geolife.py'
      - 'src/prepare_data.py'
      - 'src/fit_ambiguity.py'
      - 'src/experiment.py'
      - 'src/analyze_extensions.py'
      - 'src/build_extension_config.py'
      - 'data/geolife_*.npz'
      - '.github/workflows/data-driven-extension.yml'

permissions:
  contents: write

concurrency:
  group: data-driven-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fit, run, and analyze the extension
        run: |
          rm -rf results/data_driven_ambiguity results/data_driven_extension
          python -m src.fit_ambiguity --output results/data_driven_ambiguity/models.json
          python -m src.build_extension_config --models results/data_driven_ambiguity/models.json --output configs/data_driven_extension.json
          python -m src.experiment --config configs/data_driven_extension.json
          python -m src.analyze_extensions --run results/data_driven_extension --paper-assets

      - name: Commit refreshed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/data_driven_ambiguity results/data_driven_extension configs/data_driven_extension.json paper/data_driven_table.tex paper/dfbsp_table.tex
          if git diff --cached --quiet; then
            echo "No evidence changes"
            exit 0
          fi
          git commit -m "Refresh data-driven R-BSP and DF-BSP evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
